[tool.pytest.ini_options]
testpaths = ["app/tests"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests that require running services (docker compose up)",
    "unit: marks fast isolated tests (no external dependencies)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.pytest-asyncio]
mode = "auto"

# --- Ruff (linter + formatter) ---

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["app"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# --- Mypy (type checking) ---

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_configs = true

# Per-module overrides for libs without stubs
[[tool.mypy.overrides]]
module = [
    "litellm.*",
    "alembic.*",
]
ignore_missing_imports = true

# Tests: allow untyped defs (fixtures, parametrize)
[[tool.mypy.overrides]]
module = "app.tests.*"
disallow_untyped_defs = false
disallow_untyped_decorators = false

# Migrations: generated code, relax strict checks
[[tool.mypy.overrides]]
module = "app.migrations.*"
disallow_untyped_calls = false
disallow_untyped_defs = false

# --- Import Linter (layering contracts) ---

[tool.importlinter]
root_packages = ["app"]
include_external_packages = true

# Layered architecture (derived from actual import graph):
#   api → services → agents → infra → models|schemas → database → config
# Each layer may only import from layers below it.
[[tool.importlinter.contracts]]
name = "Architecture layers"
type = "layers"
layers = [
    "app.api",
    "app.services",
    "app.agents",
    "app.infra",
    "app.models | app.schemas",
    "app.database",
    "app.config",
]

# Framework independence: domain/infra must not couple to HTTP framework
[[tool.importlinter.contracts]]
name = "Domain does not import web framework"
type = "forbidden"
source_modules = ["app.agents", "app.services", "app.infra", "app.models", "app.schemas", "app.database", "app.config"]
forbidden_modules = ["fastapi"]

# Only the infra adapter may import the provider SDK
[[tool.importlinter.contracts]]
name = "litellm only in infra adapter"
type = "forbidden"
source_modules = ["app.api", "app.services", "app.agents", "app.models", "app.schemas", "app.database", "app.config"]
forbidden_modules = ["litellm"]
